<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1EFE8" />
    <meta name="description" content="Chet elda qonuniy ishlash uchun yo'l ko'rsatuvchi" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Qaldirg'och</title>
    <script>
      // Mavzuni sahifa chizilishidan oldin qo'llash (oq "miltillash" bo'lmasin)
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('qaldirgoch.theme') || '{}')
          var mode = s.mode || 'auto'
          var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          var r = document.documentElement
          r.dataset.mode = dark ? 'dark' : 'light'
          r.dataset.accent = s.accent || 'marjon'
          r.dataset.size = s.size || 'm'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
