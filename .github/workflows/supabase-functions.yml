name: AI funksiyasini joylash (Supabase Edge Functions)

# Kerak: GitHub → Settings → Secrets → Actions → SUPABASE_ACCESS_TOKEN
# (supabase.com/dashboard/account/tokens). Loyiha manzili VITE_SUPABASE_URL o'zgaruvchisidan olinadi.
# OpenAI kaliti bu yerda EMAS — u faqat Supabase → Edge Functions → Secrets'da (OPENAI_API_KEY).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Token borligini tekshirish
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret qo'shilmagan"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: ai-ask ni joylash
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase functions deploy ai-ask --project-ref "$REF" --no-verify-jwt --use-api --yes
